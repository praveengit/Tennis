<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Racket Check</title>
  <link rel="stylesheet" href="fonts/barlow-condensed/500.css">
  <link rel="stylesheet" href="fonts/barlow-condensed/600.css">
  <link rel="stylesheet" href="fonts/barlow-condensed/700.css">
  <link rel="stylesheet" href="fonts/barlow/400.css">
  <link rel="stylesheet" href="fonts/barlow/500.css">
  <link rel="stylesheet" href="fonts/barlow/600.css">
  <link rel="stylesheet" href="fonts/jetbrains-mono/400.css">
  <link rel="stylesheet" href="fonts/jetbrains-mono/500.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="court">
    <div class="court-inner">
      <p class="kicker">The stringer's bench</p>
      <h1>Racket Check</h1>
      <p class="lede">Photograph your racket and get a stringer's inspection: strings, frame, grommets and grip, and what to do about each.</p>
    </div>
  </header>

  <main class="bench">
    <section class="intake" aria-label="Your racket">
      <form id="form">
        <div class="step"><span class="step-no">01</span><h2>Photo</h2></div>
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*" capture="environment" hidden>
          <img id="preview" alt="Your racket" hidden>
          <span class="drop-empty" id="dropText">
            <span class="drop-title">Take a photo or choose one</span>
            <span class="drop-hint">Whole racket, face-on, in good light</span>
          </span>
          <span class="drop-change" id="dropChange" hidden>Change photo</span>
        </label>

        <div class="step"><span class="step-no">02</span><h2>About you</h2><span class="opt">optional</span></div>
        <div class="fields">
          <label>Level
            <select name="level">
              <option value="">Not set</option>
              <option>Beginner</option>
              <option>Intermediate</option>
              <option>Advanced</option>
              <option>Competitive / tournament</option>
            </select>
          </label>
          <label>Style
            <select name="style">
              <option value="">Not set</option>
              <option>Baseliner with heavy topspin</option>
              <option>Flat hitter</option>
              <option>All-court</option>
              <option>Serve and volley</option>
            </select>
          </label>
          <label>Plays
            <select name="frequency">
              <option value="">Not set</option>
              <option>Less than once a week</option>
              <option>1–2 times a week</option>
              <option>3+ times a week</option>
            </select>
          </label>
          <label>Last restrung
            <select name="lastRestrung">
              <option value="">Not set</option>
              <option>Within the last month</option>
              <option>1–3 months ago</option>
              <option>3–6 months ago</option>
              <option>Over 6 months ago</option>
              <option>Never / don't know</option>
            </select>
          </label>
          <label class="wide">Anything else?
            <textarea name="notes" rows="2" maxlength="500" placeholder="Arm pain, strings keep moving, lack of control…"></textarea>
          </label>
        </div>

        <div class="step"><span class="step-no">03</span><h2>Inspect</h2></div>
        <button type="submit" id="submit" disabled>Inspect my racket</button>
        <p id="status" class="status" role="status"></p>
      </form>
    </section>

    <section id="results" class="ticket" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
